name: Checks

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest numpy torch matplotlib seaborn
      - name: Check compilation
        run: python -m compileall -q main scripts MFBO tests
      - name: Run deterministic tests
        run: python -m pytest tests -q
