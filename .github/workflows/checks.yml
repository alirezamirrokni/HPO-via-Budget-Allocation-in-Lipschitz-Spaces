name: Checks

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest numpy torch matplotlib seaborn
      - name: Check compilation
        run: python -m compileall -q main scripts MFBO tests
      - name: Run deterministic tests
        run: python -m pytest tests -q
      - name: Materialize paper figures
        if: github.ref == 'refs/heads/cleanup/research-release-2026-11-18'
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          for source in sorted(Path('assets').glob('*.svg')):
              text = source.read_text(encoding='utf-8')
              match = re.search(r'href="data:image/webp;base64,([A-Za-z0-9+/=]+)"', text)
              if not match:
                  raise RuntimeError(f'Invalid paper figure: {source}')
              output = source.with_suffix('.webp')
              output.write_bytes(base64.b64decode(match.group(1), validate=True))
              print(f'{output}: {output.stat().st_size} bytes')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Add native raster paper figures'
            git push
          fi
